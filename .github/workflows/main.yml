name: Joomla Extension Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (e.g. 1.2.3)"
        required: true

permissions:
  contents: write  # ✅ Required to create releases and upload assets

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Determine version
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          VERSION="${{ github.event.release.tag_name }}"
        else
          VERSION="v${{ github.event.inputs.version }}"
        fi
        VERSION="${VERSION#v}"
        if [ -z "$VERSION" ]; then echo "Empty version, aborting"; exit 1; fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Build and Package
      run: |
        python build.py ${{ env.VERSION }}
        echo "ZIP_NAME=mod_eventsummary.zip" >> $GITHUB_ENV

    - name: Attach assets to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', env.VERSION) }}
        name: ${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', env.VERSION) }}
        prerelease: ${{ github.event_name != 'release' }}
        generate_release_notes: true  # ✅ Auto-fill release notes (you can edit them)
        files: |
          ${{ env.ZIP_NAME }}
          eventsummary_update.xml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
